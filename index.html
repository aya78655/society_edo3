<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>江戸時代(4) 練習問題</title>
<style>
:root{
  --paper:#EEF0EC;
  --panel:#FBFBF8;
  --ink:#1E2530;
  --sub:#5A6370;
  --ai:#27466B;
  --beni:#B23A2E;
  --matsu:#3E6B48;
  --line:#CDD3CF;
  --okbg:#E3EEE4;
  --ngbg:#F5E3E0;
  --fs:18px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#151A21;
    --panel:#1E252E;
    --ink:#E6EAEF;
    --sub:#A3ADBA;
    --ai:#8FB0DD;
    --beni:#E3786B;
    --matsu:#8CC096;
    --line:#36404C;
    --okbg:#21362A;
    --ngbg:#3E2623;
    color-scheme: dark;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  font-size:var(--fs);line-height:1.75;
  padding:0 0 64px;
}
.mincho{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}

header{background:var(--ai);color:#fff;margin-bottom:20px}
@media (prefers-color-scheme: dark){ header{background:#1C3150} }
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:10px;padding-bottom:10px}
header .ttl{font-size:.85rem;opacity:.9}
.fsz{display:flex;gap:4px}
.fsz button{
  font:inherit;font-size:.8rem;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);
  min-width:36px;padding:2px 6px;cursor:pointer
}
.fsz button[aria-pressed="true"]{background:#fff;color:#27466B}

button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--beni);outline-offset:2px}

/* スタート画面 */
.hero{padding:8px 0 20px}
.hero h1{font-size:2.4em;line-height:1.2;letter-spacing:.04em}
.hero p{color:var(--sub);font-size:.85em;margin-top:6px}
.lbl{font-size:.85em;color:var(--sub);margin:18px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  background:var(--panel);border:2px solid var(--line);padding:6px 12px;font-size:.9em
}
.chip[aria-pressed="true"]{border-color:var(--ai);color:var(--ai);font-weight:700}
.chip small{font-weight:400;color:var(--sub);margin-left:4px}
.go{
  display:block;width:100%;margin-top:26px;padding:14px;font-size:1.05em;font-weight:700;
  background:var(--ai);color:#fff;border:none
}
@media (prefers-color-scheme: dark){ .go{color:#151A21} }
.go:disabled{opacity:.4;cursor:default}

/* 問題画面 */
.bar{height:6px;background:var(--line);margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--ai);transition:width .2s}
.meta{display:flex;justify-content:space-between;font-size:.8em;color:var(--sub);margin-bottom:6px}
.card{background:var(--panel);border-left:6px solid var(--ai);padding:16px 16px 18px;position:relative}
.qn{font-weight:700;color:var(--ai);font-size:.95em}
.qt{font-size:1.08em;margin-top:4px;white-space:pre-wrap}
.kind{font-size:.75em;color:var(--sub);margin-top:6px}

.opts{display:grid;gap:8px;margin-top:14px}
.opt{
  text-align:left;background:var(--paper);border:2px solid var(--line);padding:10px 12px;
  display:flex;gap:10px;align-items:flex-start
}
.opt b{color:var(--ai);min-width:1.2em}
.opt[aria-pressed="true"]{border-color:var(--ai)}
.opt.ok{border-color:var(--matsu);background:var(--okbg)}
.opt.ng{border-color:var(--beni);background:var(--ngbg)}
.opt:disabled{cursor:default}

.ans{margin-top:14px}
.ans input,.ans textarea{
  width:100%;font:inherit;font-size:1.05em;padding:10px 12px;
  background:var(--paper);color:var(--ink);border:2px solid var(--line)
}
.ans textarea{min-height:6.5em;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{padding:9px 16px;border:2px solid var(--ai);background:transparent;color:var(--ai);font-weight:700}
.btn.fill{background:var(--ai);color:#fff}
@media (prefers-color-scheme: dark){ .btn.fill{color:#151A21} }
.hints{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.hints button{background:var(--paper);border:1px dashed var(--sub);padding:4px 10px;font-size:.9em}

.fb{margin-top:16px;padding:12px 14px;border:2px solid var(--line);background:var(--paper)}
.fb.ok{border-color:var(--matsu)}
.fb.ng{border-color:var(--beni)}
.fb .res{font-weight:700}
.fb.ok .res{color:var(--matsu)}
.fb.ng .res{color:var(--beni)}
.fb .cor{margin-top:4px}
.fb .exp{margin-top:6px;font-size:.9em;color:var(--sub)}
.fb ul{margin:6px 0 0 1.2em;font-size:.92em}
.self{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.self button{padding:10px 4px;border:2px solid var(--line);background:var(--panel);font-weight:700}
.next{display:block;width:100%;margin-top:14px;padding:12px;font-weight:700;background:var(--ink);color:var(--paper);border:none}

/* 正解の印 */
.seal{
  position:absolute;right:12px;top:10px;
  border:3px solid var(--beni);color:var(--beni);
  writing-mode:vertical-rl;font-weight:700;font-size:1.05em;letter-spacing:.15em;
  padding:6px 3px;transform:rotate(-8deg);
  animation:stamp .28s ease-out;
}
@keyframes stamp{from{transform:rotate(-8deg) scale(1.6);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){ .seal{animation:none} .bar i{transition:none} }

/* 結果画面 */
.score{font-size:3.2em;line-height:1.1;margin:10px 0 2px}
.score small{font-size:.35em;color:var(--sub)}
.wl{margin-top:18px}
.wi{background:var(--panel);border-left:4px solid var(--beni);padding:10px 12px;margin-bottom:8px;font-size:.92em}
.wi .s{font-size:.8em;color:var(--sub)}
.wi .a{margin-top:4px;color:var(--matsu);font-weight:700}
.wi.half{border-left-color:#C9962E}

/* 地図 */
:root{--seaC:#D3E2EA;--landC:#F7F6EF}
@media (prefers-color-scheme: dark){ :root{--seaC:#1B2C3A;--landC:#2B333D} }
.fig{margin-top:12px}
.map{display:block;width:100%;height:auto;max-height:62vh;border:1px solid var(--line)}
.map .sea{fill:var(--seaC)}
.map .land{fill:var(--landC);stroke:var(--sub);stroke-width:.7px;vector-effect:non-scaling-stroke}
.map .ln-sea{fill:none;stroke:var(--beni);stroke-width:2.5px;vector-effect:non-scaling-stroke}
.map .ln-road{fill:none;stroke:var(--ai);stroke-width:2.5px;vector-effect:non-scaling-stroke}
.map .tag{fill:var(--panel);stroke:var(--ink);stroke-width:1px;vector-effect:non-scaling-stroke}
.map .tagt{fill:var(--ink);font-weight:700}
.map .ref{fill:var(--ink)}
.map .reft{fill:var(--ink)}
.map .mk{fill:var(--beni)}
.map .mkc{fill:var(--panel);stroke:var(--beni);stroke-width:1.5px;vector-effect:non-scaling-stroke}
.map .mkt{fill:var(--beni);font-weight:700}
.map .lead{stroke:var(--beni);stroke-width:1px;vector-effect:non-scaling-stroke}
.fig figcaption{font-size:.75em;color:var(--sub);margin-top:2px}
.ghead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px;margin:20px 0 8px;border-bottom:2px solid var(--ai);padding-bottom:2px}
.ghead .gt{font-weight:700;color:var(--ai);font-size:1.02em}
.gall{background:none;border:none;color:var(--sub);font-size:.78em;text-decoration:underline;padding:2px 0}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <span class="ttl">5年社会 第13回 江戸時代(4)</span>
    <div class="fsz" id="fsz"></div>
  </div>
</header>
<main class="wrap" id="app"></main>

<script>
// ===== 問題データ =====
// type: "choice"(1つ選ぶ) / "multi"(すべて選ぶ) / "text"(ことばで答える) / "essay"(記述・自己採点)
var QUESTIONS = [
  // ===== 第13回 江戸時代(4) =====
  // ---- 外国船の来航 ----
  {sec:"外国船の来航", type:"text",
   q:"1792年、通商を求めて根室に来たロシアの使節は誰ですか。",

  {sec:"外国船の来航", type:"choice",

   exp:"根室は北海道の東部にあります。"},
  {sec:"外国船の来航", type:"text",

  {sec:"外国船の来航", type:"choice",

  {sec:"外国船の来航", type:"text",

  {sec:"外国船の来航", type:"text",
   q:"1837年、日本人の漂流民を送り届けに来たアメリカ船が、異国船打払令にもとづいて砲撃された事件を何といいますか。",
   answer:["モリソン号事件","モリソン号","もりそんごうじけん"], hints:["モリソン号事件","生麦事件","フェートン号事件","桜田門外の変"],

  {sec:"外国船の来航", type:"text",

  // ---- 黒船と開国 ----
  {sec:"黒船と開国", type:"text",

   exp:"蒸気機関を利用した蒸気船でした。鎖国中の日本では、蒸気の力はまだ使われていませんでした。"},
  {sec:"黒船と開国", type:"choice",

   exp:"太平洋をわたって清と貿易する船や捕鯨船の補給地として、日本を利用したいと考えました。"},

  {sec:"黒船と開国", type:"choice",

var NS = "http://www.w3.org/2000/svg";
function sv(tag, attrs, text){
  var e = document.createElementNS(NS, tag);
  Object.keys(attrs || {}).forEach(function(k){ e.setAttribute(k, attrs[k]); });
  if (text) e.textContent = text;
  return e;
}
function pathOf(pts){
  return pts.map(function(p, i){ var xy = P(p[0], p[1]); return (i ? "L" : "M") + xy[0].toFixed(1) + "," + xy[1].toFixed(1); }).join("");
}
function buildMap(key){
  var m = MAPS[key];
  var v = m.view, k = v[2] / 600 * 1.6;
  var svg = sv("svg", {viewBox: v.join(" "), class:"map", role:"img", "aria-label": m.title});
  svg.appendChild(sv("rect", {x:v[0], y:v[1], width:v[2], height:v[3], class:"sea"}));
  svg.appendChild(sv("path", {d:LAND, class:"land"}));
  (m.lines || []).forEach(function(l){
    var ln = sv("path", {d:pathOf(l.pts), class:l.style === "sea" ? "ln-sea" : "ln-road"});
    if (l.style === "sea") ln.setAttribute("stroke-dasharray", (v[2]/600*7).toFixed(2) + " " + (v[2]/600*5).toFixed(2));
    svg.appendChild(ln);
  });
  (m.lines || []).forEach(function(l){
    var xy = P(l.at[0], l.at[1]);
    svg.appendChild(sv("rect", {x:xy[0] - 9*k, y:xy[1] - 9*k, width:18*k, height:18*k, class:"tag"}));
    svg.appendChild(sv("text", {x:xy[0], y:xy[1] + 4.5*k, "font-size":13*k, "text-anchor":"middle", class:"tagt"}, l.label));
  });
  (m.refs || []).forEach(function(r){
    var xy = P(r.at[0], r.at[1]);
    svg.appendChild(sv("circle", {cx:xy[0], cy:xy[1], r:3*k, class:"ref"}));
    svg.appendChild(sv("text", {x:xy[0] + r.dx*k, y:xy[1] + r.dy*k, "font-size":11*k, class:"reft"}, r.name));
  });
  (m.marks || []).forEach(function(r){
    var xy = P(r.at[0], r.at[1]);
    if (!r.sea) svg.appendChild(sv("circle", {cx:xy[0], cy:xy[1], r:3.5*k, class:"mk"}));
    var tx = xy[0] + r.dx*k, ty = xy[1] + r.dy*k;
    if (!r.sea && Math.abs(r.dx) + Math.abs(r.dy) > 14) svg.appendChild(sv("line", {x1:xy[0], y1:xy[1], x2:tx, y2:ty - 4*k, class:"lead"}));
    svg.appendChild(sv("circle", {cx:tx, cy:ty - 4*k, r:8*k, class:"mkc"}));
    svg.appendChild(sv("text", {x:tx, y:ty, "font-size":12*k, "text-anchor":"middle", class:"mkt"}, r.label));
  });
  var fig = document.createElement("figure");
  fig.className = "fig";
  fig.appendChild(svg);
  var cap = document.createElement("figcaption");
  cap.textContent = m.title;
  fig.appendChild(cap);
  return fig;
}

var GROUPS = [
  {title:"第13回 江戸時代(4)", secs:["外国船の来航","黒船と開国","開国の影響と倒幕運動","江戸幕府の滅亡","年表","地図"]}
];

GROUPS.forEach(function(g){ SECS = SECS.concat(g.secs); });
var KIND = {choice:"記号で1つ選ぶ", multi:"記号ですべて選ぶ", text:"ことばで答える", essay:"記述（自分で採点）"};

  secs: SECS.slice(),
  shuffle: false,

  wrongOnly: false
};

var app = document.getElementById("app");

function el(tag, props, kids){
  var e = document.createElement(tag);
  if (props) {
    Object.keys(props).forEach(function(k){
      if (k === "class") e.className = props[k];
      else if (k === "text") e.textContent = props[k];
      else if (k.indexOf("on") === 0) e.addEventListener(k.slice(2), props[k]);
      else e.setAttribute(k, props[k]);
    });
  }
  (kids || []).forEach(function(c){ if (c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return e;
}

function norm(s){
  s = (s || "").normalize("NFKC").replace(/[\s\u3000・、。「」『』（）()]/g, "");
  return s.replace(/[\u30a1-\u30f6]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0x60); });
}

function shuffleArr(a){
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function correctText(q){
  if (q.type === "choice") return KANA[q.answer] + "　" + q.choices[q.answer];
  if (q.type === "multi") return q.answer.map(function(i){ return KANA[i] + " " + q.choices[i]; }).join("、");
  if (q.type === "text") return q.answer[0];
  return q.model;
}

function showStart(){
  app.replaceChildren();
  var hero = el("div", {class:"hero"}, [
    el("h1", {class:"mincho", text:"江戸時代(4)"}),
    el("p", {text:"外国船の来航から開国・江戸幕府の滅亡まで　入試形式の練習問題"})
  ]);

  var secArea = el("div");
  var go = el("button", {class:"go", type:"button"});
  var chipBtns = {};

  function count(){
    return QUESTIONS.filter(function(q){ return state.secs.indexOf(q.sec) >= 0; }).length;
  }
  function refresh(){
    var n = count();
    go.textContent = n ? "はじめる（" + n + "問）" : "単元を選んでください";
    go.disabled = n === 0;
    SECS.forEach(function(s){ chipBtns[s].setAttribute("aria-pressed", state.secs.indexOf(s) >= 0 ? "true" : "false"); });
  }

  GROUPS.forEach(function(g){
    var head = el("div", {class:"ghead"});
    head.appendChild(el("span", {class:"gt mincho", text:g.title}));
    var allBtn = el("button", {class:"gall", type:"button", text:"この回をまとめて選ぶ／外す"});
    allBtn.addEventListener("click", function(){
      var allOn = g.secs.every(function(s){ return state.secs.indexOf(s) >= 0; });
      g.secs.forEach(function(s){
        var i = state.secs.indexOf(s);
        if (allOn && i >= 0) state.secs.splice(i, 1);
        if (!allOn && i < 0) state.secs.push(s);
      });
      refresh();
    });
    head.appendChild(allBtn);
    secArea.appendChild(head);
    var chipBox = el("div", {class:"chips"});
    g.secs.forEach(function(s){
      var n = QUESTIONS.filter(function(q){ return q.sec === s; }).length;
      var b = el("button", {class:"chip", type:"button"}, [s, el("small", {text: n + "問"})]);
      b.addEventListener("click", function(){
        var i = state.secs.indexOf(s);
        if (i >= 0) state.secs.splice(i, 1); else state.secs.push(s);
        refresh();
      });
      chipBtns[s] = b;
      chipBox.appendChild(b);
    });
    secArea.appendChild(chipBox);
  });

  var modeBox = el("div", {class:"chips"});
  var mA = el("button", {class:"chip", type:"button", text:"順番どおり"});
  var mB = el("button", {class:"chip", type:"button", text:"ばらばら"});
  function setMode(v){
    state.shuffle = v;
    mA.setAttribute("aria-pressed", v ? "false" : "true");
    mB.setAttribute("aria-pressed", v ? "true" : "false");
  }
  mA.addEventListener("click", function(){ setMode(false); });
  mB.addEventListener("click", function(){ setMode(true); });
  setMode(state.shuffle);
  modeBox.appendChild(mA); modeBox.appendChild(mB);

  go.addEventListener("click", function(){
    var list = QUESTIONS.filter(function(q){ return state.secs.indexOf(q.sec) >= 0; });

  });
  refresh();

  app.appendChild(hero);
  app.appendChild(secArea);
  app.appendChild(el("div", {class:"lbl", text:"出題の順番"}));
  app.appendChild(modeBox);
  app.appendChild(go);
}

function startQuiz(list, wrongOnly){
  state.list = state.shuffle ? shuffleArr(list) : list.slice();
  state.idx = 0;
  state.res = {};
  state.wrongOnly = wrongOnly;
  showQuestion();
}

function showQuestion(){
  app.replaceChildren();
  var q = state.list[state.idx];
  var total = state.list.length;

  var bar = el("div", {class:"bar"}, [el("i", {style:"width:" + (state.idx / total * 100) + "%"})]);
  var meta = el("div", {class:"meta"}, [
    el("span", {text: q.sec + (state.wrongOnly ? "（まちがえた問題）" : "")}),
    el("span", {text: (state.idx + 1) + " / " + total})
  ]);
  var card = el("div", {class:"card"});
  card.appendChild(el("div", {class:"qn", text:"問" + (state.idx + 1)}));
  card.appendChild(el("div", {class:"qt mincho", text:q.q}));
  card.appendChild(el("div", {class:"kind", text:KIND[q.type]}));
  if (q.map) card.appendChild(buildMap(q.map));

  var area = el("div");
  card.appendChild(area);

  app.appendChild(bar);
  app.appendChild(meta);
  app.appendChild(card);

  if (q.type === "choice") buildChoice(q, area, card);
  else if (q.type === "multi") buildMulti(q, area, card);
  else if (q.type === "text") buildText(q, area, card);
  else buildEssay(q, area, card);
}

function finish(q, card, result, fbNode){
  state.res[q.id] = result;
  if (result === "ok") card.appendChild(el("div", {class:"seal mincho", text:"正解", "aria-hidden":"true"}));
  card.appendChild(fbNode);
  var last = state.idx >= state.list.length - 1;
  var ready = false;
  var nx = el("button", {class:"next", type:"button", text: last ? "結果を見る" : "次の問題へ",
    onclick: function(){
      if (!ready) return;
      if (last) showResult();
      else { state.idx++; showQuestion(); window.scrollTo(0, 0); }
    }});
  card.appendChild(nx);
  setTimeout(function(){ ready = true; nx.focus({preventScroll:true}); }, 600);
  fbNode.scrollIntoView({block:"nearest", behavior:"smooth"});
}

function feedback(ok, q, extraNode){
  var fb = el("div", {class:"fb " + (ok ? "ok" : "ng")});
  fb.appendChild(el("div", {class:"res", text: ok ? "正解！" : "ざんねん"}));
  if (!ok) fb.appendChild(el("div", {class:"cor", text:"答え：" + correctText(q)}));
  if (extraNode) fb.appendChild(extraNode);
  if (q.exp) fb.appendChild(el("div", {class:"exp", text:q.exp}));
  return fb;
}

function buildChoice(q, area, card){
  var box = el("div", {class:"opts"});
  var btns = [];
  q.choices.forEach(function(c, i){
    var b = el("button", {class:"opt", type:"button"}, [el("b", {text:KANA[i]}), el("span", {text:c})]);
    b.addEventListener("click", function(){
      btns.forEach(function(x){ x.disabled = true; });
      btns[q.answer].classList.add("ok");
      var ok = i === q.answer;
      if (!ok) b.classList.add("ng");
      finish(q, card, ok ? "ok" : "ng", feedback(ok, q));
    });
    btns.push(b);
    box.appendChild(b);
  });
  area.appendChild(box);
}

function buildMulti(q, area, card){

    b.addEventListener("click", function(){

  });

      else if (sel[i]) b.classList.add("ng");
    });
    var ok = chosen.length === q.answer.length && q.answer.every(function(a){ return chosen.indexOf(a) >= 0; });
    finish(q, card, ok ? "ok" : "ng", feedback(ok, q));
  });
  area.appendChild(box);
  area.appendChild(el("div", {class:"row"}, [check]));
}

function buildText(q, area, card){
  var wrap = el("div", {class:"ans"});
  var inp = el("input", {type:"text", autocomplete:"off", autocorrect:"off", autocapitalize:"off", spellcheck:"false", "aria-label":"答えを入力", placeholder:"ここに答えを書く"});
  var check = el("button", {class:"btn fill", type:"button", text:"答え合わせ"});
  var hintBtn = el("button", {class:"btn", type:"button", text:"ヒント"});
  var hintBox = el("div", {class:"hints"});
  var usedHint = false;
  var done = false;

  inp.addEventListener("focus", function(){
    setTimeout(function(){ inp.scrollIntoView({block:"center", behavior:"smooth"}); }, 300);
  });

  function judge(){
    if (done || !inp.value.trim()) return;
    done = true;
    inp.disabled = true; check.disabled = true; hintBtn.disabled = true;
    hintBox.querySelectorAll("button").forEach(function(b){ b.disabled = true; });
    var v = norm(inp.value);
    var ok = q.answer.some(function(a){ return norm(a) === v; });
    var extra = null;
    if (ok && usedHint) extra = el("div", {class:"exp", text:"ヒントを使って正解。次は何も見ないで書けるようにしよう。"});
    if (ok && norm(q.answer[0]) !== v) extra = el("div", {class:"cor", text:"漢字で書くと：" + q.answer[0]});
    finish(q, card, ok ? "ok" : "ng", feedback(ok, q, extra));
  }

  var lastComp = 0;
  inp.addEventListener("compositionend", function(){ lastComp = Date.now(); });
  inp.addEventListener("keydown", function(e){
    if (e.key !== "Enter") return;
    e.preventDefault();
    if (e.isComposing || e.keyCode === 229 || Date.now() - lastComp < 100) return;
    judge();
  });
  check.addEventListener("click", judge);
  hintBtn.addEventListener("click", function(){
    if (hintBox.childNodes.length) return;
    usedHint = true;
    (q.hints || []).forEach(function(h){
      hintBox.appendChild(el("button", {type:"button", text:h, onclick:function(){ inp.value = h; }}));
    });
  });

  wrap.appendChild(inp);
  wrap.appendChild(el("div", {class:"row"}, [check, hintBtn]));
  wrap.appendChild(hintBox);
  area.appendChild(wrap);
}

function buildEssay(q, area, card){
  var wrap = el("div", {class:"ans"});
  var ta = el("textarea", {"aria-label":"答えを書く", placeholder:"ここに答えを書く（書けたら答え合わせ）"});
  var check = el("button", {class:"btn fill", type:"button", text:"答え合わせ"});

  ta.addEventListener("focus", function(){
    setTimeout(function(){ ta.scrollIntoView({block:"center", behavior:"smooth"}); }, 300);
  });

  check.addEventListener("click", function(){
    check.disabled = true; ta.readOnly = true;
    var fb = el("div", {class:"fb"});
    fb.appendChild(el("div", {class:"res", text:"模範解答"}));
    fb.appendChild(el("div", {class:"cor mincho", text:q.model}));
    fb.appendChild(el("div", {class:"exp", text:"次のポイントが書けているか確かめよう"}));
    var ul = el("ul");
    q.points.forEach(function(p){ ul.appendChild(el("li", {text:p})); });
    fb.appendChild(ul);
    var self = el("div", {class:"self"});
    var opts = [["○ できた","ok"],["△ おしい","half"],["✕ まだ","ng"]];
    opts.forEach(function(o){
      self.appendChild(el("button", {type:"button", text:o[0], onclick:function(){
        self.querySelectorAll("button").forEach(function(b){ b.disabled = true; });
        fb.className = "fb " + (o[1] === "ok" ? "ok" : "ng");
        finish(q, card, o[1], el("div"));
      }}));
    });
    fb.appendChild(self);
    card.appendChild(fb);
    fb.scrollIntoView({block:"nearest", behavior:"smooth"});
  });

  wrap.appendChild(ta);
  wrap.appendChild(el("div", {class:"row"}, [check]));
  area.appendChild(wrap);
}

// ===== 結果画面 =====
function showResult(){
  app.replaceChildren();
  var list = state.list;
  var pts = 0;
  var wrong = [];
  list.forEach(function(q){
    var r = state.res[q.id];
    if (r === "ok") pts += 1;
    else { if (r === "half") pts += 0.5; wrong.push(q); }
  });
  var pct = Math.round(pts / list.length * 100);

  app.appendChild(el("div", {class:"lbl", text:"結果"}));
  app.appendChild(el("div", {class:"score mincho"}, [String(pct), el("small", {text:" 点（" + list.length + "問中 " + pts + "問正解）"})]));

  var row = el("div", {class:"row"});
  if (wrong.length) {
    row.appendChild(el("button", {class:"btn fill", type:"button", text:"まちがえた問題だけもう一度（" + wrong.length + "問）",
      onclick:function(){ startQuiz(wrong, true); window.scrollTo(0,0); }}));
  }
  row.appendChild(el("button", {class:"btn", type:"button", text:"単元を選びなおす", onclick:function(){ showStart(); window.scrollTo(0,0); }}));
  app.appendChild(row);

  if (wrong.length) {
    var wl = el("div", {class:"wl"});
    wl.appendChild(el("div", {class:"lbl", text:"まちがえた問題（△をふくむ）"}));
    wrong.forEach(function(q){
      wl.appendChild(el("div", {class:"wi" + (state.res[q.id] === "half" ? " half" : "")}, [
        el("div", {class:"s", text:q.sec}),
        el("div", {class:"mincho", text:q.q}),
        el("div", {class:"a", text:"答え：" + correctText(q)})
      ]));
    });
    app.appendChild(wl);
  } else {
    app.appendChild(el("p", {class:"lbl", text:"全問正解です。"}));
  }
}

showStart();
